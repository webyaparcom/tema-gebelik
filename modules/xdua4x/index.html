<section class="modulex-sbl{{sblsinif}}" aria-labelledby="sbl-{{id}}-baslik">
  <div class="modulex-sbl-ic">
    <aside class="modulex-sbl-yan">
      {{sblust}}
      <h2 class="modulex-sbl-baslik" id="sbl-{{id}}-baslik">{{sblbaslik}}</h2>
      {{sblmetin}}
      {{sblcta}}
    </aside>
    <div class="modulex-sbl-govde">
      {{sblarama}}
      {{sblfiltre}}
      <div class="modulex-sbl-liste">{{sblliste}}</div>
    </div>
  </div>
</section>

<style>
  /* sss-bolunmus — bölünmüş SSS (15 Kas 2026, G4 · D17). faq-1 ortalı kart akordeonudur; bu modül iki sütun: yapışkan başlık sütunu +
     ince çizgili, numaralı <details> listesi (yerel akordeon — JS'siz de çalışır), kategori çipleri ve arama. Renkler desing'den. */
  .modulex-sbl {
    box-sizing: border-box;
    width: 100%;
    padding: clamp(56px, 8vw, 112px) 20px;
    background: --bg--;
    color: --text--;
    font-size: 1rem;
    font-family: var(--mx-font-sans, inherit);
  }
  .modulex-sbl *,
  .modulex-sbl *::before,
  .modulex-sbl *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sbl :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  .modulex-sbl-ic {
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 8fr);
    gap: clamp(32px, 6vw, 96px);
    align-items: start;
    max-width: --max--;
    margin-inline: auto;
  }
  .modulex-sbl-yan { position: sticky; inset-block-start: 96px; }
  .modulex-sbl-ust {
    margin: 0 0 14px;
    color: --accentInk--;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .modulex-sbl-ust::before {
    content: "";
    display: inline-block;
    width: 28px;
    height: 2px;
    margin-inline-end: 10px;
    vertical-align: middle;
    background: --accent--;
  }
  .modulex-sbl-baslik {
    margin: 0;
    font-family: var(--mx-font-heading, inherit);
    font-size: clamp(2rem, 4vw, 3.25rem);
    font-weight: 750;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .modulex-sbl-metin { margin: 20px 0 0; color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sbl-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-block-start: 28px;
    padding: 14px 22px;
    border-radius: 999px;
    background: --accent--;
    color: --accentText--;
    font-weight: 650;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .modulex-sbl-cta:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px --accent--; }
  .modulex-sbl-cta:focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }

  .modulex-sbl-arama { position: relative; margin-block-end: 18px; }
  .modulex-sbl-arama .material-symbols-outlined {
    position: absolute;
    inset-block-start: 14px;
    inset-inline-start: 16px;
    color: --muted--;
    pointer-events: none;
  }
  .modulex-sbl-girdi {
    width: 100%;
    padding-block: 14px;
    padding-inline: 50px 16px;
    border: 1px solid --cizgi--;
    border-radius: 14px;
    background: --kartBg--;
    color: --text--;
    font: inherit;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .modulex-sbl-girdi:focus { outline: none; border-color: --accent--; box-shadow: 0 0 0 4px color-mix(in srgb, --accent-- 18%, transparent); }
  .modulex-sbl-yok { margin: 14px 0 0; color: --muted--; }

  .modulex-sbl-filtre { display: flex; flex-wrap: wrap; gap: 8px; margin-block-end: 22px; }
  .modulex-sbl-cip {
    padding: 8px 16px;
    border: 1px solid --cizgi--;
    border-radius: 999px;
    background: transparent;
    color: --text--;
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .modulex-sbl-cip:hover { border-color: --accent--; }
  .modulex-sbl-cip[aria-pressed="true"] { background: --text--; border-color: --text--; color: --bg--; }
  .modulex-sbl-cip:focus-visible { outline: 3px solid --accent--; outline-offset: 2px; }

  .modulex-sbl-liste { border-block-start: 1px solid --cizgi--; }
  .modulex-sbl-oge { border-block-end: 1px solid --cizgi--; }
  .modulex-sbl-oge[hidden] { display: none; }
  .modulex-sbl-soru {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 20px;
    align-items: baseline;
    padding: 24px 4px;
    list-style: none;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .modulex-sbl-soru::-webkit-details-marker { display: none; }
  .modulex-sbl-soru:hover { color: --accentInk--; }
  .modulex-sbl-soru:focus-visible { outline: 3px solid --accent--; outline-offset: 4px; border-radius: 6px; }
  .modulex-sbl-no {
    color: --accent--;
    font-size: 0.9rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .modulex-sbl-soru-metin { font-size: clamp(1.05rem, 1.6vw, 1.3rem); font-weight: 650; line-height: 1.4; }
  .modulex-sbl-arti { position: relative; width: 22px; height: 22px; align-self: center; }
  .modulex-sbl-arti::before,
  .modulex-sbl-arti::after {
    content: "";
    position: absolute;
    inset-block-start: 10px;
    inset-inline-start: 2px;
    width: 18px;
    height: 2px;
    border-radius: 2px;
    background: currentColor;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .modulex-sbl-arti::after { transform: rotate(90deg); }
  .modulex-sbl-oge[open] .modulex-sbl-arti::after { transform: rotate(0deg); opacity: 0; }
  .modulex-sbl-cevap { padding-block: 0 26px; padding-inline: calc(20px + 2ch) 42px; color: --muted--; line-height: 1.75; }
  .modulex-sbl-cevap p { margin: 0; }
  .modulex-sbl-oge[open] .modulex-sbl-cevap { animation: modulex-sbl-ac 0.35s ease both; }
  @keyframes modulex-sbl-ac { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sbl-baslik { letter-spacing: 0; line-height: 1.3; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sbl-ust { letter-spacing: 0; }

  @media (max-width: 1024px) {
    .modulex-sbl-ic { grid-template-columns: minmax(0, 1fr); }
    .modulex-sbl-yan { position: static; }
  }
  @media (max-width: 768px) {
    .modulex-sbl-soru { gap: 14px; padding-block: 20px; }
    .modulex-sbl-cevap { padding-inline: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sbl *,
    .modulex-sbl *::before,
    .modulex-sbl *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
  (() => {
    const kok = document.querySelector(".modulex-sbl");
    if (!kok || kok.dataset.sblHazir) return;
    kok.dataset.sblHazir = "1";
    const ogeler = [...kok.querySelectorAll(".modulex-sbl-oge")];
    const girdi = kok.querySelector(".modulex-sbl-girdi");
    const yok = kok.querySelector(".modulex-sbl-yok");
    const cipler = [...kok.querySelectorAll(".modulex-sbl-cip")];
    let kategori = "";

    /* tek açık: details[name] desteklemeyen tarayıcılar için yedek */
    if (ogeler[0] && ogeler[0].getAttribute("name") && !("name" in HTMLDetailsElement.prototype)) {
      ogeler.forEach((o) => o.addEventListener("toggle", () => {
        if (o.open) ogeler.forEach((d) => { if (d !== o) d.open = false; });
      }));
    }

    const kucuk = (s) => s.toLocaleLowerCase(document.documentElement.lang || undefined);
    const suz = () => {
      const q = girdi ? kucuk(girdi.value.trim()) : "";
      let gorunen = 0;
      ogeler.forEach((o) => {
        const uyar = (!kategori || o.dataset.kategori === kategori) && (!q || kucuk(o.textContent).includes(q));
        o.hidden = !uyar;
        if (uyar) gorunen += 1;
      });
      if (yok) yok.hidden = gorunen > 0;
    };
    girdi?.addEventListener("input", suz);
    cipler.forEach((c) => c.addEventListener("click", () => {
      kategori = c.dataset.kategori || "";
      cipler.forEach((d) => d.setAttribute("aria-pressed", d === c ? "true" : "false"));
      suz();
    }));
  })();
</script>
